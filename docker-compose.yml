version: '3.8'

# ==============================================================================
# 🚀 DOCKER COMPOSE PROFILES GUIDE
# ==============================================================================
# Start the full environment (Postgres + MongoDB + GraphQL + Redis):
#   docker compose --profile all up -d
#
# SQL & Web GUI only (PostgreSQL + PGWeb):
#   docker compose --profile sql up -d
#
# GraphQL only (PostgreSQL + PostGraphile GraphiQL IDE):
#   docker compose --profile graphql up -d
#
# NoSQL Document DB only (MongoDB):
#   docker compose --profile nosql up -d
#
# Redis Cache & Key-Value only (Redis 7 + RedisInsight GUI):
#   docker compose --profile redis up -d
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_interview_postgres
    restart: always
    profiles: ["sql", "graphql", "all"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: interview_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql_init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  pgweb:
    image: sosedoff/pgweb
    container_name: sql_interview_pgweb
    restart: always
    profiles: ["sql", "all"]
    environment:
      - PGWEB_DATABASE_URL=postgres://admin:adminpassword@postgres:5432/interview_db?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  mongodb:
    image: mongo:7.0
    container_name: nosql_interview_mongo
    restart: always
    profiles: ["nosql", "all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: interview_nosql
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_init:/docker-entrypoint-initdb.d
      - mongo_data:/data/db

  graphql:
    image: graphile/postgraphile:v4
    container_name: sql_interview_graphql
    restart: always
    profiles: ["graphql", "all"]
    command:
      [
        "--connection", "postgres://admin:adminpassword@postgres:5432/interview_db",
        "--schema", "public",
        "--enhance-graphiql",
        "--allow-explain",
        "--watch"
      ]
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: cache_interview_redis
    restart: always
    profiles: ["redis", "nosql", "all"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: cache_interview_redisinsight
    restart: always
    profiles: ["redis", "all"]
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  postgres_data:
  mongo_data:
  redis_data:
